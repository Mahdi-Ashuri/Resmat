services:
  mariadb:
    image: mariadb:11
    container_name: mon-projet-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_dev_password
      MARIADB_DATABASE: mon_projet
      MARIADB_USER: spring_user
      MARIADB_PASSWORD: spring_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: