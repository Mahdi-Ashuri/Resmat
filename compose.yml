services:
  mariadb:
    image: mariadb:11
    container_name: resmat-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: MyPassword
      MARIADB_DATABASE: resmat
      MARIADB_USER: resmat
      MARIADB_PASSWORD: MyPassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: